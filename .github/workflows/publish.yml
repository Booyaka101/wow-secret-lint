name: Publish to npm with provenance

# Manual only. Auth is npm Trusted Publishing (OIDC): the package on npmjs.com
# names Booyaka101/wow-secret-lint + publish.yml as its trusted publisher, so
# the id-token: write permission below is the whole credential. There is no
# token to rotate, and provenance is attached automatically.
#
# Trusted publishing needs npm >= 11.5.1, newer than the npm bundled with Node
# 22, hence the explicit upgrade step. Without it the publish fails with an
# auth error that reads like a bad token.
#
# Run it after the release tag exists and CI is green on that commit.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v1.4.0'
        required: true

permissions:
  contents: read
  id-token: write # required for provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Meet the trusted-publishing version floor
        run: |
          set -euo pipefail
          npm install -g npm@^11.5.1
          node --version
          npm --version
      - run: npm ci
      - run: npm test
      - name: Refuse to publish a version that is already on the registry
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "wow-secret-lint@$v" version >/dev/null 2>&1; then
            echo "wow-secret-lint@$v is already published; bump the version first" >&2
            exit 1
          fi
          echo "publishing $v"
      # Auth is npm Trusted Publishing (OIDC): the package names this repo and
      # this workflow filename on npmjs.com, so id-token: write above is the
      # whole credential and provenance is attached automatically.
      - run: npm publish --access public
